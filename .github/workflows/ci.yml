name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build, vet, format, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

  image:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t professional-email-drafting:test .

      - name: Smoke the image without a key
        run: |
          set +e
          out="$(docker run --rm professional-email-drafting:test -input testdata/email.json 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 2 ]; then echo "expected exit 2 without a key, got $code" >&2; exit 1; fi
          if ! echo "$out" | grep -q GOOGLE_API_KEY; then echo "expected a GOOGLE_API_KEY message" >&2; exit 1; fi
